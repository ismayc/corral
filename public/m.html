<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Corral</title>
<meta name="theme-color" content="#1b1823">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corral">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  /* The phone view of Corral: the same dusk palette as the desktop page. Green, amber, and red mean
     agent status only. */
  @font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:400 800; font-display:swap;
               src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2'); }
  :root {
    --ground:#1b1823; --panel:#24202d; --raise:#2d2838; --rail:#3a3446; --text:#eee9f6; --muted:#9d94ad;
    --fence:#8b7cf6; --lavender:#c9c1ff; --term:#100e15;
    --working:#e5a93d; --idle:#4cc38a; --blocked:#e5584d; --unknown:#5d566b;
    --brand:'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:Menlo, Monaco, ui-monospace, monospace;
    --vh:100dvh;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--ground); color:var(--text); height:100%;
               font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { overscroll-behavior:none; }
  button { font:inherit; color:var(--text); background:var(--raise); border:1px solid var(--rail);
           border-radius:10px; padding:8px 14px; cursor:pointer; touch-action:manipulation; }
  button:active { background:var(--rail); }
  button.primary { background:var(--fence); border-color:var(--fence); color:#fff; font-weight:600; }
  :focus-visible { outline:2px solid var(--lavender); outline-offset:1px; }

  .view { position:fixed; inset:0; height:var(--vh); display:flex; flex-direction:column;
          padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; min-height:52px;
           border-bottom:1px solid var(--rail); background:var(--panel); flex:none; }
  header h1 { font:700 20px/1.1 var(--brand); margin:0; letter-spacing:-.01em; }
  header .sub { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .grow { flex:1; min-width:0; }
  header .title { font:600 16px/1.2 var(--brand); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon { width:28px; height:28px; flex:none; }
  .iconbtn { padding:6px 10px; min-width:40px; }

  /* Home: the windows running on the Mac */
  #list { flex:1; overflow-y:auto; padding:0 12px calc(96px + env(safe-area-inset-bottom)); }
  .section { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
             margin:0 -12px 8px; padding:12px 16px 8px; }
  /* In the list, each group's header stays at the top while its windows scroll under it. */
  #list .section { position:sticky; top:0; z-index:2; background:var(--ground); display:flex; gap:8px; align-items:baseline; }
  #list .section .n { color:var(--text); }
  /* The summary under the title: one chip per group, which jumps to it. */
  #jump { display:flex; gap:8px; padding:8px 12px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--rail);
          flex:none; scrollbar-width:none; }
  #jump::-webkit-scrollbar { display:none; }
  #jump button { flex:none; display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:99px;
                 font-size:14px; background:var(--ground); }
  #jump button::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--unknown); }
  #jump button.idle::before { background:var(--idle); } #jump button.busy::before { background:var(--working); }
  #jump button b { font-weight:700; }
  #jump button.on { border-color:var(--fence); background:var(--raise); }
  .card { display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--rail);
          border-radius:14px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .card:active:not(:has(.ask:active)) { background:var(--raise); }
  .card.need { border-color:var(--blocked); }
  /* A permission prompt: what Claude asks to do, and its answers. */
  .ask { margin-top:10px; cursor:default; }
  .ask pre { margin:0 0 8px; padding:8px 10px; max-height:11em; overflow:auto; background:var(--term); border-radius:8px;
             font:12px/1.4 var(--mono); white-space:pre-wrap; word-break:break-word; color:#ddd6ea; }
  .ask .answers { display:flex; flex-direction:column; gap:6px; }
  .ask .answers button { text-align:left; font-size:15px; padding:9px 12px; }
  .ask .answers button.deny { border-color:var(--blocked); color:#ffb4ad; }
  .ask .answers button:disabled { opacity:.5; }
  #askbar { flex:none; max-height:45%; overflow-y:auto; padding:10px 10px 6px; background:var(--panel); border-top:2px solid var(--blocked); }
  #askbar .head { font:600 15px var(--brand); color:#ffb4ad; margin-bottom:6px; }
  .card .top { display:flex; align-items:center; gap:8px; }
  .card .name { font:600 17px/1.2 var(--brand); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .when { color:var(--muted); font-size:13px; flex:none; }
  .card .where { color:var(--muted); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 9px;
          border-radius:99px; background:var(--raise); color:var(--muted); flex:none; }
  .pill::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--unknown); }
  .pill.idle { color:var(--idle); } .pill.idle::before { background:var(--idle); }
  .pill.busy { color:var(--working); } .pill.busy::before { background:var(--working); animation:pulse 1.4s ease-in-out infinite; }
  .pill.need { color:#ffb4ad; } .pill.need::before { background:var(--blocked); }
  #jump button.need::before { background:var(--blocked); }
  @keyframes pulse { 50% { opacity:.35; } }
  .empty { color:var(--muted); text-align:center; padding:40px 20px; }
  .banner { background:var(--raise); border:1px solid var(--fence); border-radius:14px; padding:12px 14px; margin-bottom:12px;
            display:flex; gap:10px; align-items:center; }
  .banner .grow { flex:1; }
  #fab { position:fixed; z-index:5; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
         padding:14px 26px; border-radius:99px; font-size:17px; box-shadow:0 8px 24px #0008; white-space:nowrap; }

  /* Sheets: start something new, and notifications */
  .sheet { position:fixed; inset:0; background:#0009; display:flex; align-items:flex-end; z-index:20; }
  .sheet .panel { width:100%; max-height:88%; background:var(--panel); border-radius:18px 18px 0 0; display:flex; flex-direction:column;
                  padding-bottom:env(safe-area-inset-bottom); }
  .sheet .head { padding:14px 16px 10px; display:flex; gap:10px; align-items:center; }
  .sheet .head h2 { font:700 18px var(--brand); margin:0; flex:1; }
  #notifybody { overflow-y:auto; padding:0 16px 18px; }
  #notifybody p { margin:0 0 12px; color:var(--muted); font-size:15px; }
  #notifybody p.state { color:var(--text); }
  #notifybody ol { margin:0 0 12px; padding-left:22px; color:var(--text); font-size:15px; }
  #notifybody .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--rail); font-size:15px; }
  #notifybody .row span { flex:1; }
  #notifybody .row small { display:block; color:var(--muted); font-size:13px; }
  #notifybody input[type=checkbox] { width:22px; height:22px; accent-color:var(--fence); }
  #notifybody .btns { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 16px; }

  /* Changes: git status and diff of the window's project */
  #difflist { flex:1; overflow:auto; background:var(--term); padding:0 0 calc(16px + env(safe-area-inset-bottom)); }
  #difflist .files { padding:10px 12px; border-bottom:1px solid var(--rail); background:var(--panel); }
  #difflist .files button { display:flex; width:100%; gap:10px; text-align:left; border:0; background:none; padding:5px 2px;
                            font:13px var(--mono); border-radius:6px; }
  #difflist .files button b { width:22px; flex:none; color:var(--lavender); }
  #difflist .files button span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #difflist .d { font:12px/1.45 var(--mono); padding:0 10px; white-space:pre-wrap; word-break:break-all; color:#ddd6ea; }
  #difflist .d.add { background:#1d3a2a; color:#b9f0cf; } #difflist .d.del { background:#45201f; color:#ffc2bd; }
  #difflist .d.hunk { color:var(--lavender); background:#221d30; } #difflist .d.meta { color:var(--muted); }
  #difflist .d.file { font-weight:700; color:var(--text); background:var(--raise); padding:8px 10px; margin-top:10px;
                      position:sticky; top:0; border-top:1px solid var(--rail); border-bottom:1px solid var(--rail); }
  #difflist .note { color:var(--muted); padding:30px 16px; text-align:center; font:15px -apple-system, sans-serif; }
  /* Card controls: Stop on a working window, and ⋯ for the window's own menu */
  .card { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .card .top .more { flex:none; padding:0 10px; height:28px; line-height:26px; border-radius:8px; font-size:17px; color:var(--muted); }
  .card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .card .tag { font-size:12px; color:var(--muted); border:1px solid var(--rail); border-radius:99px; padding:2px 9px; }
  .card .tags button { font-size:14px; padding:6px 12px; }
  .card .tags button.stop { border-color:var(--working); color:var(--working); }
  /* Quick replies: tap one to put it in the message box */
  #quick { display:flex; gap:6px; overflow-x:auto; padding:6px 8px 0; background:var(--panel); flex:none; scrollbar-width:none; }
  #quick::-webkit-scrollbar { display:none; }
  #quick button { flex:none; font-size:14px; padding:6px 12px; border-radius:99px; background:var(--ground); }
  #quick button.edit { color:var(--muted); border-style:dashed; }
  /* The window menu, the last reply, and the quick reply editor reuse the sheet */
  .sheetbody { overflow-y:auto; padding:0 16px 18px; }
  .sheetbody .menu button { display:block; width:100%; text-align:left; margin-bottom:8px; padding:12px 14px; font-size:16px; }
  .sheetbody .menu button.danger { border-color:var(--blocked); color:#ffb4ad; }
  .sheetbody p { color:var(--muted); margin:0 0 12px; font-size:15px; }
  .sheetbody input, .sheetbody textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--rail);
    background:var(--ground); color:var(--text); font:16px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; margin-bottom:10px; }
  .sheetbody .reply { white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.5; background:var(--ground);
    border:1px solid var(--rail); border-radius:10px; padding:12px; margin-bottom:12px; -webkit-user-select:text; user-select:text; }
  .sheetbody .btns { display:flex; gap:8px; flex-wrap:wrap; }
  #difflist .files button.commit { margin-top:10px; width:auto; padding:10px 16px; border-radius:10px; background:var(--fence);
                                   color:#fff; font:600 15px -apple-system, BlinkMacSystemFont, sans-serif; }
  #photo { padding:9px 11px; border-radius:18px; flex:none; display:inline-flex; }
  #photo svg { width:22px; height:22px; }
  .seg { display:flex; margin:0 16px 10px; background:var(--ground); border:1px solid var(--rail); border-radius:10px; padding:3px; }
  .seg button { flex:1; border:0; background:none; padding:7px 4px; font-size:14px; border-radius:8px; color:var(--muted); }
  .seg button.on { background:var(--raise); color:var(--text); font-weight:600; }
  #q { margin:0 16px 8px; padding:10px 12px; border-radius:10px; border:1px solid var(--rail); background:var(--ground);
       color:var(--text); font-size:16px; }
  #projects { overflow-y:auto; padding:0 10px 14px; }
  .proj { display:flex; width:100%; align-items:center; gap:10px; text-align:left; border:0; background:none;
          border-bottom:1px solid var(--rail); border-radius:0; padding:12px 8px; }
  .proj .dot { width:9px; height:9px; border-radius:50%; background:var(--unknown); flex:none; }
  .proj .dot.working { background:var(--working); } .proj .dot.idle, .proj .dot.done { background:var(--idle); }
  .proj .dot.blocked { background:var(--blocked); }
  .proj .n { flex:1; min-width:0; } .proj .n div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .proj .n .p { color:var(--muted); font-size:12px; }
  .proj .tag { flex:none; font-size:12px; font-weight:600; color:var(--lavender); border:1px solid var(--rail);
               border-radius:99px; padding:2px 9px; }

  /* Terminal view */
  #termwrap { flex:1; min-height:0; background:var(--term); padding:4px 2px 0 4px; position:relative; }
  #termwrap .xterm { height:100%; }
  #keys { display:flex; gap:6px; overflow-x:auto; padding:7px 8px; background:var(--panel); border-top:1px solid var(--rail);
          flex:none; scrollbar-width:none; }
  #keys::-webkit-scrollbar { display:none; }
  #keys button { flex:none; padding:7px 11px; font:600 14px var(--mono); border-radius:8px; min-width:42px; }
  #keys button.on { background:var(--fence); border-color:var(--fence); }
  #keys button[data-k="suggest"] { font-family:inherit; border-color:var(--fence); color:var(--lavender); }
  #compose { display:flex; gap:8px; align-items:flex-end; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
             background:var(--panel); flex:none; }
  #msg { flex:1; min-width:0; resize:none; max-height:30vh; padding:10px 12px; border-radius:18px; border:1px solid var(--rail);
         background:var(--ground); color:var(--text); font:16px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; }
  #msg::placeholder { color:var(--muted); }
  #send { border-radius:18px; padding:10px 16px; }
  #conn { position:absolute; z-index:3; top:8px; right:10px; font-size:12px; color:var(--muted); background:#000a; padding:3px 8px; border-radius:99px; }

  /* History: the scrollback as plain text */
  #histtext { flex:1; overflow:auto; margin:0; padding:12px 12px calc(16px + env(safe-area-inset-bottom)); background:var(--term);
              font:12px/1.4 var(--mono); white-space:pre-wrap; word-break:break-word; color:#ddd6ea;
              -webkit-user-select:text; user-select:text; }

  /* Conversation: your prompts and Claude's replies from the transcript, without the tool calls. It covers the
     terminal rather than hiding it: a hidden terminal measures 2 columns wide and would squeeze the Mac's window. */
  #convo { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; background:var(--ground); }
  #chat { flex:1; min-height:0; overflow:auto; padding:10px 12px 12px; display:flex; flex-direction:column; gap:10px;
          -webkit-user-select:text; user-select:text; }
  #chat .working { align-self:flex-start; color:var(--working); font-size:13px; }
  /* Claude Code's status lines, as drawn under its input box */
  #statusline { flex:none; margin:0; padding:6px 12px; background:var(--term); border-top:1px solid var(--rail); color:var(--muted);
                font:11px/1.4 var(--mono); white-space:pre-wrap; word-break:break-word; max-height:30%; overflow:auto; }
  #chat .msg { white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.45; padding:9px 12px; border-radius:14px; max-width:88%; }
  #chat .you { align-self:flex-end; background:#3b3160; border-bottom-right-radius:4px; }
  #chat .claude { align-self:flex-start; background:var(--panel); border:1px solid var(--rail); border-bottom-left-radius:4px; }
  #chat .note, #chat .when { align-self:center; color:var(--muted); font-size:12px; text-align:center; }
  #chat .when { margin-top:6px; }

  #toast { position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top)); z-index:30; background:var(--raise);
           border:1px solid var(--fence); border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px #0009; }
</style>
</head>
<body>

<section id="home" class="view">
  <header>
    <img class="icon" src="/favicon.svg" alt="">
    <div class="grow"><h1>Corral</h1><div class="sub" id="machine"></div></div>
    <button class="iconbtn" id="bell" aria-label="Notifications">Alerts</button>
    <button class="iconbtn" id="todesk" title="Open the full desktop page">Desktop</button>
  </header>
  <nav id="jump" aria-label="Jump to a group" hidden></nav>
  <div id="list"></div>
  <button id="fab" class="primary">+ Start something</button>
</section>

<section id="termview" class="view" hidden>
  <header>
    <button class="iconbtn" id="back" aria-label="Back to the list">&lsaquo;</button>
    <div class="grow"><div class="title" id="ttitle"></div><div class="sub" id="tsub"></div></div>
    <button class="iconbtn" id="viewbtn" hidden>Terminal</button>
    <button class="iconbtn" id="morebtn" aria-label="More: changes and scrollback">&middot;&middot;&middot;</button>
  </header>
  <div id="termwrap"><div id="term" style="height:100%"></div><span id="conn" hidden>Reconnecting&hellip;</span>
    <div id="convo" hidden><div id="chat"></div><pre id="statusline" hidden></pre></div></div>
  <div id="askbar" hidden></div>
  <div id="keys"></div>
  <div id="quick"></div>
  <div id="compose">
    <button id="photo" aria-label="Send a photo to Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input id="photofile" type="file" accept="image/*" multiple hidden>
    <textarea id="msg" rows="1" placeholder="Message or dictate" enterkeyhint="send" autocapitalize="sentences"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
</section>

<section id="histview" class="view" hidden>
  <header>
    <button class="iconbtn" id="histback" aria-label="Back to the terminal">&lsaquo;</button>
    <div class="grow"><div class="title" id="htitle"></div><div class="sub">Scrollback, as text you can select</div></div>
    <button class="iconbtn" id="histcopy">Copy all</button>
  </header>
  <pre id="histtext"></pre>
</section>

<section id="diffview" class="view" hidden>
  <header>
    <button class="iconbtn" id="diffback" aria-label="Back to the terminal">&lsaquo;</button>
    <div class="grow"><div class="title" id="dtitle"></div><div class="sub" id="dsub">Changes not yet committed</div></div>
    <button class="iconbtn" id="diffreload">Refresh</button>
  </header>
  <div id="difflist"></div>
</section>

<div id="gen" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2 id="gentitle"></h2><button class="iconbtn" id="genx" aria-label="Close">&times;</button></div>
    <div class="sheetbody" id="genbody"></div>
  </div>
</div>

<div id="notify" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2>Notifications</h2><button class="iconbtn" id="notifyx" aria-label="Close">&times;</button></div>
    <div id="notifybody"></div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2>Start in a project</h2><button class="iconbtn" id="sheetx" aria-label="Close">&times;</button></div>
    <div class="seg" id="agentseg">
      <button data-a="claude" class="on">Claude Code</button>
      <button data-a="claude-continue">Last session</button>
      <button data-a="">Shell</button>
    </div>
    <input id="q" type="search" placeholder="Search projects" autocomplete="off" autocapitalize="off">
    <div id="projects"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/m.js"></script>
</body>
</html>
