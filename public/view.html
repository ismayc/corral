<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* The markdown viewer: one file, drawn or as text. Colors are in theme.css, as on the Mac page. */
  @font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:400 800; font-display:swap;
               src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2'); }
  :root {
    --brand:'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--ground); }
  body { margin:0; color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  :focus-visible { outline:2px solid var(--lavender); outline-offset:1px; }

  #bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; padding:9px 16px;
         background:var(--panel); border-bottom:1px solid var(--rail); }
  .what { flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; }
  #name { font:700 16px var(--brand); white-space:nowrap; }
  #path { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; }
  #state { color:var(--muted); font-size:12px; white-space:nowrap; }
  .seg { display:flex; flex:none; border:1px solid var(--rail); border-radius:7px; overflow:hidden; }
  .seg button { font:inherit; font-size:13px; color:var(--muted); background:transparent; border:0; padding:4px 12px; cursor:pointer; }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed=true] { background:var(--fence); color:#fff; }
  #theme { flex:none; font:inherit; font-size:13px; color:var(--muted); background:transparent; border:1px solid var(--rail);
           border-radius:7px; padding:4px 10px; cursor:pointer; }
  #theme:hover { color:var(--text); }

  #doc { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  .note { color:var(--muted); }
  pre.raw { margin:0; font:13px/1.55 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4; }

  .md { overflow-wrap:break-word; }
  .md > :first-child, .md li > :first-child, .md blockquote > :first-child { margin-top:0; }
  .md > :last-child, .md li > :last-child, .md blockquote > :last-child { margin-bottom:0; }
  .md p { margin:0 0 14px; }
  .md .center { text-align:center; }
  .md details { margin:0 0 14px; padding:8px 12px; border:1px solid var(--rail); border-radius:8px; }
  .md summary { cursor:pointer; font-weight:600; }
  .md details[open] > summary { margin-bottom:8px; }
  .md :is(td,th) > :last-child { margin-bottom:0; }
  .md [align=center] { text-align:center; } .md [align=right] { text-align:right; }
  .md kbd { font:.86em var(--mono); border:1px solid var(--rail); border-radius:4px; padding:0 4px; }
  .md :is(h1,h2,h3,h4,h5,h6) { font-family:var(--brand); line-height:1.25; margin:28px 0 10px; letter-spacing:-.01em; scroll-margin-top:56px; }
  .md h1 { font-size:30px; font-weight:800; }
  .md h2 { font-size:23px; padding-bottom:5px; border-bottom:1px solid var(--rail); }
  .md h3 { font-size:19px; }
  .md :is(h4,h5,h6) { font-size:16px; }
  .md :is(ul,ol) { margin:0 0 14px; padding-left:26px; }
  .md li { margin:3px 0; }
  .md li > p { margin:0; }
  .md code { font:.86em var(--mono); background:var(--term); border-radius:4px; padding:1px 5px; }
  .md pre { margin:0 0 14px; padding:11px 14px; background:var(--term); border:1px solid var(--rail); border-radius:8px; overflow:auto; }
  .md pre code { background:none; padding:0; font-size:13px; line-height:1.5; }
  .md pre.front { color:var(--muted); font:12.5px/1.5 var(--mono); }
  .md blockquote { margin:0 0 14px; padding-left:14px; border-left:3px solid var(--fence); color:var(--muted); }
  .md hr { border:0; border-top:1px solid var(--rail); margin:22px 0; }
  .md a { color:var(--lavender); }
  .md img { max-width:100%; height:auto; vertical-align:middle; }
  .md .table { overflow:auto; margin:0 0 14px; }
  .md table { border-collapse:collapse; font-size:14px; }
  .md :is(th,td) { border:1px solid var(--rail); padding:5px 10px; text-align:left; vertical-align:top; }
  .md th { background:var(--panel); }
</style>
</head>
<body>
<header id="bar">
  <div class="what"><span id="name"></span><span id="path"></span></div>
  <span id="state" role="status"></span>
  <div class="seg" role="group" aria-label="How to show the file">
    <button id="rendered" type="button" aria-pressed="true">Rendered</button>
    <button id="raw" type="button" aria-pressed="false">Raw</button>
  </div>
  <button id="theme" type="button"></button>
</header>
<main id="doc"><p class="note">Loading...</p></main>
<script src="/clientlog.js"></script>
<script src="/markdown.js"></script>
<script src="/view.js"></script>
</body>
</html>
