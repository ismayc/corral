<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* The pop-out: one Corral window in a browser window of its own, with its project's files on the left
     (hidden or shown per space) and the files opened from them in tabs on the right. Colors are in theme.css. */
  @font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:400 800; font-display:swap;
               src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2'); }
  :root {
    --brand:'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
    --tw:50%;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--ground); color:var(--text);
               font:13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  :focus-visible { outline:2px solid var(--lavender); outline-offset:1px; }
  button, input { font:inherit; color:var(--text); background:var(--ground); border:1px solid var(--rail); border-radius:6px; padding:3px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--fence); }
  input[type=checkbox] { accent-color:var(--fence); margin:0; }

  #bar { flex:none; display:flex; align-items:center; gap:10px; padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--rail); }
  #filesbtn[aria-pressed=true] { background:var(--fence); border-color:var(--fence); color:#fff; }
  #label { font:700 15px var(--brand); white-space:nowrap; }
  #cwd { color:var(--muted); font-size:12px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #state { color:var(--muted); font-size:12px; white-space:nowrap; }

  #main { flex:1; min-height:0; display:flex; }
  #files { flex:none; width:260px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--rail); min-height:0; }
  .fhead { display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--rail); color:var(--muted); font-size:12px; }
  .fhead .ft { flex:1; font:600 12px var(--brand); }
  .fhead label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .fhead button { padding:0 7px; background:transparent; color:var(--muted); }
  #tree { flex:1; overflow:auto; padding:4px 0 10px 8px; font:12px Menlo, Monaco, monospace; }
  .node { display:flex; align-items:center; gap:4px; padding:1px 10px 1px 0; white-space:nowrap; cursor:pointer; }
  .node:hover { background:var(--raise); }
  .node.file { color:var(--muted); } .node.file:hover { color:var(--text); }
  .node.file.on { color:var(--lavender); }
  .node .ic { width:12px; flex:none; text-align:center; color:var(--muted); }
  .node .lk { color:var(--fence); }
  #tree .note { color:var(--muted); padding:2px 4px; font-size:11px; }

  #termpane { flex:1; min-width:0; display:flex; background:var(--term); }
  #term { flex:1; min-width:0; padding:4px 0 0 6px; }
  #split { flex:none; width:6px; cursor:col-resize; background:var(--rail); }
  #split:hover, #split.drag { background:var(--fence); }
  #tabpane { flex:none; width:var(--tw); min-width:0; display:flex; flex-direction:column; background:var(--ground); }
  #tabs { flex:none; display:flex; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--rail); }
  .tab { display:flex; align-items:center; gap:4px; flex:none; max-width:220px; padding:6px 4px 6px 12px; border-right:1px solid var(--rail);
         color:var(--muted); cursor:pointer; user-select:none; }
  .tab:hover { color:var(--text); }
  .tab[aria-selected=true] { background:var(--ground); color:var(--text); box-shadow:inset 0 2px 0 var(--fence); }
  .tab .tn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .tx { border:0; background:transparent; color:var(--muted); padding:0 5px; line-height:16px; }
  .tab .tx:hover { color:var(--text); background:var(--raise); }
  #tabtools { flex:none; display:flex; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--rail); }
  #tabpath { flex:1; min-width:0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
  #tabtools button { padding:2px 9px; font-size:12px; }
  .seg { display:flex; flex:none; border:1px solid var(--rail); border-radius:7px; overflow:hidden; }
  .seg button { font-size:12px; color:var(--muted); background:transparent; border:0; border-radius:0; padding:2px 10px; }
  .seg button[aria-pressed=true] { background:var(--fence); color:#fff; }
  #pane { flex:1; min-height:0; overflow:auto; }
  #pane .doc { max-width:860px; margin:0 auto; padding:20px 18px 60px; font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #pane .note { color:var(--muted); padding:20px 18px; }
  #pane .note button { margin-left:8px; }
  /* Edit mode (editor.js): the text fills the tab. */
  #pane .editor { display:flex; flex-direction:column; gap:8px; height:100%; padding:10px 14px 14px; }
  .ebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ebar button { padding:2px 10px; font-size:12px; }
  .ebar .esave { background:var(--fence); border-color:var(--fence); color:#fff; }
  .estate { color:var(--muted); font-size:12px; }
  textarea.edit { flex:1; min-height:0; width:100%; resize:none; font:12.5px/1.55 var(--mono); color:var(--text);
                  background:var(--term); border:1px solid var(--rail); border-radius:8px; padding:12px 14px; tab-size:4; }
  #pane .imgbox { padding:16px; text-align:center; }
  #pane .imgbox img { max-width:100%; height:auto; background:repeating-conic-gradient(var(--raise) 0 25%, var(--panel) 0 50%) 0 0/16px 16px; }
  #pane iframe { display:block; width:100%; height:100%; border:0; background:#fff; }
  pre.raw { margin:0; padding:14px 18px 60px; font:12.5px/1.55 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4; }

  .md { overflow-wrap:break-word; }
  .md > :first-child, .md li > :first-child, .md blockquote > :first-child { margin-top:0; }
  .md > :last-child, .md li > :last-child, .md blockquote > :last-child { margin-bottom:0; }
  .md p { margin:0 0 14px; }
  .md .center { text-align:center; }
  .md details { margin:0 0 14px; padding:8px 12px; border:1px solid var(--rail); border-radius:8px; }
  .md summary { cursor:pointer; font-weight:600; }
  .md details[open] > summary { margin-bottom:8px; }
  .md :is(td,th) > :last-child { margin-bottom:0; }
  .md [align=center] { text-align:center; } .md [align=right] { text-align:right; }
  .md kbd { font:.86em var(--mono); border:1px solid var(--rail); border-radius:4px; padding:0 4px; }
  .md :is(h1,h2,h3,h4,h5,h6) { font-family:var(--brand); line-height:1.25; margin:28px 0 10px; letter-spacing:-.01em; scroll-margin-top:12px; }
  .md h1 { font-size:28px; font-weight:800; }
  .md h2 { font-size:22px; padding-bottom:5px; border-bottom:1px solid var(--rail); }
  .md h3 { font-size:18px; }
  .md :is(h4,h5,h6) { font-size:15px; }
  .md :is(ul,ol) { margin:0 0 14px; padding-left:26px; }
  .md li { margin:3px 0; }
  .md li > p { margin:0; }
  .md code { font:.86em var(--mono); background:var(--term); border-radius:4px; padding:1px 5px; }
  .md pre { margin:0 0 14px; padding:11px 14px; background:var(--term); border:1px solid var(--rail); border-radius:8px; overflow:auto; }
  .md pre code { background:none; padding:0; font-size:12.5px; line-height:1.5; }
  .md pre.front { color:var(--muted); font:12px/1.5 var(--mono); }
  .md blockquote { margin:0 0 14px; padding-left:14px; border-left:3px solid var(--fence); color:var(--muted); }
  .md hr { border:0; border-top:1px solid var(--rail); margin:22px 0; }
  .md a { color:var(--lavender); }
  .md img { max-width:100%; height:auto; vertical-align:middle; }
  .md .table { overflow:auto; margin:0 0 14px; }
  .md table { border-collapse:collapse; font-size:13.5px; }
  .md :is(th,td) { border:1px solid var(--rail); padding:5px 10px; text-align:left; vertical-align:top; }
  .md th { background:var(--panel); }

  .menu { position:fixed; z-index:30; width:240px; display:flex; flex-direction:column; gap:1px; padding:6px;
          background:var(--panel); border:1px solid var(--rail); border-radius:10px; box-shadow:0 12px 32px var(--shadow); }
  .menu button { text-align:left; border-color:transparent; background:transparent; }
  .menu button:hover { background:var(--raise); }
  .menu .mhead { color:var(--muted); font-size:12px; padding:4px 9px 6px; overflow-wrap:anywhere; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:40; padding:9px 16px; background:var(--raise);
           border:1px solid var(--rail); border-radius:10px; box-shadow:0 12px 32px var(--shadow); max-width:80vw; }
</style>
</head>
<body>
<header id="bar">
  <button id="filesbtn" type="button" aria-pressed="true" title="Hide the file panel for this space">Files</button>
  <span id="label"></span><span id="cwd"></span>
  <span id="state" role="status"></span>
  <button id="theme" type="button"></button>
  <button id="sendback" type="button" title="Close this pop-out and put the window back with the others in Corral">Send back</button>
</header>
<div id="main">
  <aside id="files">
    <div class="fhead">
      <span class="ft">Files</span>
      <label title="Show files and folders whose names start with a dot"><input type="checkbox" id="hidden"> Hidden</label>
      <button id="reload" type="button" title="Read the folders again">&#8635;</button>
    </div>
    <div id="tree"></div>
  </aside>
  <section id="termpane"><div id="term"></div></section>
  <div id="split" title="Drag to resize. Double-click to reset." hidden></div>
  <section id="tabpane" hidden>
    <div id="tabs" role="tablist"></div>
    <div id="tabtools">
      <span id="tabpath"></span>
      <div class="seg" id="mdmode" role="group" aria-label="How to show the file">
        <button id="rendered" type="button" aria-pressed="true">Rendered</button>
        <button id="raw" type="button" aria-pressed="false">Raw</button>
        <button id="edit" type="button" aria-pressed="false" title="Edit the file here">Edit</button>
      </div>
      <button id="tabreload" type="button" title="Read the file again">&#8635;</button>
      <button id="tabmac" type="button" title="Open this file in its app on the Mac">Open on the Mac</button>
    </div>
    <div id="pane"></div>
  </section>
</div>
<div id="toast" role="status" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/clientlog.js"></script>
<script src="/markdown.js"></script>
<script src="/editor.js"></script>
<script src="/pop.js"></script>
</body>
</html>
