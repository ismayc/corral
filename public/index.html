<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  /* Corral: "dusk over the paddock". The dark is tinted toward the fence violet, never neutral black.
     Violet marks brand and focus; lavender is the fence rail; green, amber, and red mean agent status only. */
  @font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:400 800; font-display:swap;
               src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2'); }
  :root {
    --ground:#1b1823; --panel:#24202d; --raise:#2d2838; --rail:#3a3446; --text:#eee9f6; --muted:#9d94ad;
    --fence:#8b7cf6; --lavender:#c9c1ff; --term:#100e15;
    --working:#e5a93d; --idle:#4cc38a; --blocked:#e5584d; --unknown:#5d566b;
    --brand:'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--ground); color:var(--text);
               font:13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  :focus-visible { outline:2px solid var(--lavender); outline-offset:1px; }
  button, input, select { font:inherit; color:var(--text); background:var(--ground); border:1px solid var(--rail);
                          border-radius:6px; padding:4px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--fence); }
  input { flex:1; min-width:0; } input::placeholder { color:var(--muted); }
  input[type=checkbox] { flex:none; accent-color:var(--fence); }

  #app { display:grid; grid-template-columns:304px 1fr; height:100%; }

  /* Sidebar */
  #side { background:var(--panel); border-right:1px solid var(--rail); display:flex; flex-direction:column; min-height:0; }
  .brandmark { padding:16px 16px 0; }
  .brandmark h1 { font:800 30px/1 var(--brand); letter-spacing:-.02em; margin:0; font-variation-settings:'opsz' 96; }
  .brandmark p { margin:4px 0 0; color:var(--muted); font-size:12px; }
  .brandmark svg { display:block; width:272px; height:26px; margin:12px 0 14px; }
  #side .row { padding:0 16px 8px; display:flex; gap:6px; }
  #side .tools button { font-size:11.5px; padding:2px 9px; background:transparent; color:var(--muted); }
  #side .tools button:hover { color:var(--text); }
  #bulk select { flex:1; min-width:0; }
  .opt { padding:0 16px 10px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; }
  .note { color:var(--muted); padding:8px 16px; }

  /* Group headers: plain section names, sentence case */
  .sec { padding:12px 16px 4px; font:600 12px var(--brand); color:var(--muted); border-top:1px solid var(--rail); cursor:default; }
  .sec.tog { cursor:pointer; } .sec.tog:hover { color:var(--text); }
  .sec.cat { display:flex; align-items:baseline; gap:7px; cursor:pointer; padding:9px 16px 7px; color:var(--text);
             font:700 14.5px var(--brand); letter-spacing:-.005em; }
  .sec.cat:hover { background:var(--raise); }
  .sec.cat.over { background:#342b55; box-shadow:inset 3px 0 var(--fence); }
  .sec.cat .cc { width:12px; color:var(--muted); flex:none; font-size:11px; }
  .sec.cat .cn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sec.cat .ct { color:var(--muted); font:500 12px var(--brand); flex:1; }
  .sec.cat .acts { display:none; gap:2px; align-self:center; }
  .sec.cat:hover .acts { display:flex; }
  .sec.cat .acts button { padding:0 6px; line-height:17px; font:11px -apple-system, sans-serif; }
  .sec.cat input.catname { flex:1; min-width:0; padding:1px 6px; font:inherit; }

  /* Space rows */
  #spaces { overflow:auto; flex:1; }
  .space { padding:5px 16px 5px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .space:hover { background:var(--raise); }
  .space .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .space.has-win .name { color:var(--lavender); font-weight:600; }
  .space .more { opacity:.35; padding:0 6px; color:var(--muted); cursor:pointer; flex:none; }
  .space:hover .more, .space .more:focus-visible { opacity:1; } .space .more:hover { color:var(--text); }
  .space.sel { background:#342b55; box-shadow:inset 3px 0 var(--fence); }
  .space.over { box-shadow:inset 0 2px 0 var(--fence); }
  .catmenu .mhead { color:var(--muted); font-size:12px; padding:4px 9px 6px; }
  #bulk button { flex:none; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:40; display:flex; align-items:center; gap:12px;
           padding:9px 10px 9px 16px; background:var(--raise); border:1px solid var(--rail); border-radius:10px;
           box-shadow:0 12px 32px rgba(8,6,14,.6); }
  #toast button { padding:2px 10px; border-color:var(--fence); color:var(--lavender); background:transparent; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--unknown); }
  .dot.working { background:var(--working); } .dot.idle { background:var(--idle); } .dot.blocked { background:var(--blocked); }
  .chev { width:14px; flex:none; color:var(--muted); text-align:center; cursor:pointer; user-select:none; }
  .chev:hover { color:var(--text); }
  .tree { padding:0 0 4px 34px; font:12px Menlo, Monaco, monospace; min-width:max-content; }
  .node { display:flex; align-items:center; gap:4px; padding:1px 16px 1px 0; white-space:nowrap; }
  .node.dir { cursor:pointer; } .node.dir:hover { background:var(--raise); }
  .node.file { color:var(--muted); cursor:pointer; } .node.file:hover { background:var(--raise); color:var(--text); } .node .ic { width:12px; flex:none; text-align:center; color:var(--muted); }
  .node .lk { color:var(--fence); }
  .tree .note { padding:2px 16px; font-size:11px; }

  /* Inactive projects */
  #inactive { flex:none; max-height:35%; overflow:auto; }
  .proj { display:flex; align-items:center; gap:6px; padding:4px 16px; }
  .proj .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .proj .ago { color:var(--muted); font-size:11px; flex:none; }
  .proj button { padding:0 8px; line-height:18px; font-size:11px; flex:none; }
  .proj.gone .name { text-decoration:line-through; }

  /* Category menu */
  .catmenu { position:fixed; z-index:30; width:220px; max-height:60vh; overflow:auto; display:flex; flex-direction:column; gap:1px;
             padding:6px; background:var(--panel); border:1px solid var(--rail); border-radius:10px; box-shadow:0 12px 32px rgba(8,6,14,.6); }
  .catmenu button { text-align:left; border-color:transparent; background:transparent; }
  .catmenu button:hover { background:var(--raise); }
  .catmenu input { margin-top:6px; }
  .catmenu.openwith { width:280px; }
  .catmenu .msep { border-top:1px solid var(--rail); margin:5px 2px; }
  .catmenu .mnote { color:var(--muted); font-size:11px; padding:2px 9px 4px; }
  .catmenu label.always { display:flex; align-items:center; gap:7px; padding:5px 9px; font-size:12px; cursor:pointer; }
  .catmenu label.always input { margin:0; flex:none; }
  .catmenu .forget { color:var(--lavender); font-size:12px; }

  /* Top bar */
  #main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #bar { display:flex; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--rail); background:var(--panel); }
  #bar label { color:var(--muted); display:flex; align-items:center; gap:6px; }
  #restorewrap { display:flex; }
  #restore { border-color:var(--fence); color:var(--lavender); border-radius:6px 0 0 6px; }
  #restorex { border-left:0; border-radius:0 6px 6px 0; color:var(--muted); padding:4px 8px; }
  #bar .sp { flex:1; }
  #newshell { background:var(--fence); border-color:var(--fence); color:#14101f; font-weight:600; }
  #newshell:hover { background:var(--lavender); border-color:var(--lavender); }
  #count { color:var(--muted); }
  #laywrap { position:relative; }
  #laymenu { position:absolute; top:calc(100% + 6px); left:0; z-index:20; width:380px; padding:10px; display:grid;
             grid-template-columns:repeat(4, 1fr); gap:8px; background:var(--panel); border:1px solid var(--rail);
             border-radius:10px; box-shadow:0 12px 32px rgba(8,6,14,.6); }
  .lay { display:flex; flex-direction:column; align-items:center; gap:5px; padding:7px 2px; background:transparent;
         border-color:transparent; font-size:11px; color:var(--muted); }
  .lay.on { border-color:var(--fence); color:var(--text); }
  .thumb { position:relative; width:64px; height:40px; }
  .thumb i { position:absolute; background:var(--rail); border-radius:2px; }
  .lay.on .thumb i, .lay:hover .thumb i { background:var(--fence); }

  /* The pen: zones and windows. A layout is a set of zones (fractions of #grid); each window sits in a .slot over its zone. */
  #grid { flex:1; position:relative; min-height:0; margin:4px; }
  .slot, .zone-empty { position:absolute; padding:4px; min-width:0; min-height:0; }
  .win { position:relative; height:100%; display:flex; flex-direction:column; min-width:0; background:var(--term); border:1px solid var(--rail);
         border-radius:8px; overflow:hidden; }
  /* The focused window has its gate closed: a lavender rail across the top. */
  .win.focus { border-color:#4d4366; }
  .win.focus::after { content:''; position:absolute; left:0; right:0; top:0; height:3px; background:var(--lavender); pointer-events:none; }
  .title { display:flex; align-items:center; gap:8px; padding:5px 6px 4px 10px; background:var(--panel);
           border-bottom:1px solid var(--rail); cursor:grab; }
  .title .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .title .cwd { color:var(--muted); font-size:11px; }
  .title button { padding:0 7px; line-height:18px; background:transparent; border-color:transparent; color:var(--muted); }
  .title button:hover { color:var(--text); border-color:var(--rail); }
  .term { flex:1; min-height:0; padding:5px 0 0 8px; }
  /* A permission prompt in this window: its answers, under the title bar. */
  .win .ask { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 8px; background:#3a1d1f;
              border-bottom:1px solid var(--blocked, #e5584d); font-size:12.5px; }
  .win .ask b { color:#ffb4ad; margin-right:4px; }
  .win .ask button { padding:2px 10px; }
  .win .ask button.allow { background:var(--fence); border-color:var(--fence); color:#fff; }
  .win .ask button.deny { border-color:#e5584d; color:#ffb4ad; }
  .win.asking { border-color:#e5584d; }
  #tray .chip.asking { border-color:#e5584d; color:#ffb4ad; }
  .zone-empty > div { height:100%; border:1px dashed var(--rail); border-radius:8px; display:flex; align-items:center;
                      justify-content:center; text-align:center; padding:12px; color:var(--muted); font-size:12.5px; }
  .zone-empty.over > div, .slot.over .win { border-color:var(--fence); border-style:solid; }

  /* Bottom bar */
  /* --th is the bar's height; drag its top edge to change it. Chip text and padding scale with it. */
  #tray { --th:44px; position:relative; display:flex; gap:calc(var(--th) * .16); flex-wrap:wrap; align-items:center;
          min-height:var(--th); padding:calc(var(--th) * .14) 12px; border-top:1px solid var(--rail); background:var(--panel); }
  #tray .lbl { color:var(--muted); font-size:calc(var(--th) * .29); margin-right:2px; }
  #tray .lbl + .chip { margin-left:0; }
  #tray .chip + .lbl { margin-left:10px; }
  #tray .chip { font-size:calc(var(--th) * .32); padding:calc(var(--th) * .1) calc(var(--th) * .3); border-radius:var(--th); }
  #traygrip { position:absolute; left:0; right:0; top:-5px; height:9px; cursor:ns-resize; z-index:2; }
  #traygrip::after { content:''; position:absolute; left:50%; top:3px; width:36px; height:3px; margin-left:-18px;
                     border-radius:2px; background:var(--rail); opacity:0; transition:opacity .15s; }
  #traygrip:hover::after, #traygrip.drag::after { opacity:1; background:var(--fence); }
  .chip { padding:2px 11px; border:1px solid var(--rail); border-radius:13px; cursor:pointer; background:var(--ground); }
  .chip:hover { border-color:var(--fence); }
  .chip.min::before { content:'\25B4\00a0\00a0'; color:var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brandmark">
      <h1>Corral</h1>
      <p>Round up your herdr spaces</p>
      <svg viewBox="0 0 272 26" aria-hidden="true">
        <g fill="#8b7cf6"><path d="M4 26V8l6-7 6 7v18z"/><path d="M40 26V8l6-7 6 7v18z"/><path d="M76 26V8l6-7 6 7v18z"/><path d="M112 26V8l6-7 6 7v18z"/><path d="M148 26V8l6-7 6 7v18z"/><path d="M184 26V8l6-7 6 7v18z"/><path d="M220 26V8l6-7 6 7v18z"/><path d="M256 26V8l6-7 6 7v18z"/></g>
        <g fill="#c9c1ff"><rect x="0" y="11" width="272" height="3.5" rx="1.75"/><rect x="0" y="19" width="272" height="3.5" rx="1.75"/></g>
      </svg>
    </div>
    <div class="row"><input id="filter" placeholder="Find a space" autocomplete="off"><button id="refresh" title="Reload from herdr">&#8635;</button></div>
    <div class="row tools">
      <button id="newcat" title="Create a category">+ Category</button>
      <button id="expall" title="Expand every category">Expand all</button>
      <button id="colall" title="Collapse every category">Collapse all</button>
    </div>
    <div id="newcatrow" class="row" hidden><input id="newcatname" placeholder="Category name, then Enter" maxlength="40" autocomplete="off"></div>
    <div id="bulk" class="row" hidden></div>
    <label class="opt"><input type="checkbox" id="hidden"> Show hidden files</label>
    <div id="inactive"></div>
    <div id="spaces"></div>
  </aside>
  <section id="main">
    <div id="bar">
      <button id="newshell" title="Open a plain shell in your home folder">New shell</button>
      <span id="restorewrap" hidden><button id="restore"></button><button id="restorex" title="Forget these windows">&times;</button></span>
      <label>A space opens <select id="agent">
        <option value="claude">Claude Code</option>
        <option value="claude-continue">Claude Code, last session</option>
        <option value="">A plain shell</option>
      </select></label>
      <div id="laywrap"><button id="laybtn" title="Choose how windows are arranged"></button><div id="laymenu" hidden></div></div>
      <label id="colslab" hidden>Columns <select id="cols"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <label id="rowslab" hidden>Rows <select id="rows"><option value="auto">Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <span class="sp"></span>
      <button id="alerts" title="Show a desktop notification when a window needs you while this page is in the background">Alerts: off</button>
      <button id="phone" hidden title="Copy the link that opens Corral on your phone or another Tailscale device">On your phone</button>
      <span id="count" class="note"></span>
    </div>
    <div id="grid"></div>
    <div id="tray" hidden></div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/app.js"></script>
</body>
</html>
