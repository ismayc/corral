# Applied to the dedicated `the dedicated tmux server (-L corral)` server only; never touches ~/.tmux.conf.
# The browser window is the UI, so hide tmux's own status line.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g escape-time 10
set -g set-titles off
