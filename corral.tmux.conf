# Applied to the dedicated `the dedicated tmux server (-L corral)` server only; never touches ~/.tmux.conf.
# The browser window is the UI, so hide tmux's own status line.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g escape-time 10
set -g set-titles off
# Pass Claude Code's links (OSC 8) on to the browser's terminal, which tmux strips unless the outer terminal
# is known to support them. A fixed index, so sourcing this file again does not add another copy.
set -s terminal-features[20] "xterm*:hyperlinks"
